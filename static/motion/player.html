<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion player</title>
<!--KD-TOKENS-->
<style>
html,body{margin:0;background:var(--ds-bg,Canvas);color:var(--ds-text,CanvasText);font-family:var(--ds-font-sans,sans-serif)}
#kd-canvas{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;margin:auto}
#kd-controls:not([hidden]){display:flex;gap:12px;align-items:center;padding:12px}
#kd-scrub{flex:1;min-width:0;accent-color:var(--ds-accent)}
button{font:inherit;color:var(--ds-text);background:var(--ds-surface);border:1px solid var(--ds-accent);border-radius:var(--ds-radius-m);padding:8px 16px}
</style>
</head>
<body>
<canvas id="kd-canvas" aria-label="Video preview"></canvas>
<div id="kd-controls" hidden><button id="kd-toggle" type="button">Pause</button><input id="kd-scrub" aria-label="Video time" type="range" min="0" step="0.001"><output id="kd-time"></output></div>
<!--KD-PROJECT-->
<script type="module" src="/static/motion/engine.js"></script>
</body>
</html>
