<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="fixtures.js"></script>
<script src="shim.js"></script>
<style>
  .demo-badge { position: fixed; z-index: 10200; right: 14px; bottom: 14px; padding: 6px 12px; border-radius: 999px;
    background: #2A1F18; color: #F3EADB; font: 500 11px/1.4 Jost, "Segoe UI", sans-serif; pointer-events: none; opacity: .92; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairos demo</title>
<link rel="manifest" href="static/manifest.webmanifest">
<meta name="theme-color" content="#F3EADB">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Home-screen app draws edge to edge: the page runs under the status bar
     (env(safe-area-inset-top) pads the controls) and the top frost fades it. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="static/img/app-192.png">
<link rel="icon" type="image/svg+xml" href="static/img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="static/img/favicon-32.png">
<link rel="preload" href="static/fonts/Jost-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="static/css/kairos-theme.css">
<link rel="stylesheet" href="static/css/style.css">
<link rel="stylesheet" href="static/css/chat.css">
<link rel="stylesheet" href="static/css/appearance.css">
<link rel="stylesheet" href="static/css/swarm.css">
<link rel="stylesheet" href="static/css/settings.css">
<link rel="stylesheet" href="static/css/interface.css">
<link rel="stylesheet" href="static/css/agents-messages.css">
<link rel="stylesheet" href="static/css/redesign.css">
<link rel="stylesheet" href="static/css/redesign-settings.css">
<link rel="stylesheet" href="static/css/redesign-notes.css">
<link rel="stylesheet" href="static/css/redesign-library.css">
<link rel="stylesheet" href="static/css/vault.css">
<link rel="stylesheet" href="static/css/redesign-calendar.css">
<link rel="stylesheet" href="static/css/redesign-email.css">
<link rel="stylesheet" href="static/css/redesign-tasks.css">
<link rel="stylesheet" href="static/css/redesign-cookbook.css">
<link rel="stylesheet" href="static/css/redesign-forge.css">
<link rel="stylesheet" href="static/css/redesign-home.css">
<link rel="stylesheet" href="static/css/redesign-shell.css">
<link rel="stylesheet" href="static/css/redesign-chat.css">
<link rel="stylesheet" href="static/css/redesign-toolstore.css">
<link rel="stylesheet" href="static/css/redesign-welcome.css">
<link rel="stylesheet" href="static/css/redesign-overlays.css">
<link rel="stylesheet" href="static/css/redesign-agents.css">
<link rel="stylesheet" href="static/css/redesign-mobile.css">
<link rel="stylesheet" href="static/css/redesign-tabbar.css">
<link rel="stylesheet" href="static/css/mascot.css">
</head>
<body>
  <!-- The desktop window's title bar (style.css .titlebar): drag anywhere on
       it; Windows draws its window controls over the right end in the bar's
       colour (electron/main.js, appearance.js syncTitleBar). Hidden in a
       browser tab. -->
  <header id="titlebar" class="titlebar"><div class="titlebar-brand" id="titlebar-brand"></div><span class="titlebar-tab" id="titlebar-tab"></span></header>
  <div id="app">
    <!-- Phone navigation is the bottom tab bar (static/js/mobileTabBar.js,
         2026-10-22), which replaced the menu button that lived here. The
         backdrop stays for the sidebar's own close path. -->
    <div id="mobile-backdrop" class="mobile-backdrop hidden"></div>
    <div id="sidebar">
      <div class="sidebar-header">
        <div id="brand"></div>
        <button id="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="nav"></button>
      </div>
      <nav id="nav"></nav>
      <!-- Populated by app.js's buildSidebarFooter(). Left empty on purpose:
           it previously shipped literal "Phase 3 backend · v2 UI (early)"
           placeholder text, which flashed on every cold load until auth and
           the settings fetch resolved. -->
      <div id="sidebar-footer"></div>
    </div>
    <div id="content">
      <div class="view active" id="view-content"></div>
    </div>
  </div>

  <div id="onboarding-overlay" class="onboarding-overlay hidden"></div>

  <script src="app.js"></script>
</body>
</html>
