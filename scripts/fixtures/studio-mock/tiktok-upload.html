<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TikTok Studio (mock)</title>
<style>body{font:14px sans-serif;margin:20px} [hidden]{display:none!important} [contenteditable]{border:1px solid #888;min-height:24px;padding:4px;white-space:pre-wrap} [role=switch]{display:inline-block;width:30px;height:16px;border:1px solid #888;border-radius:8px} [role=switch][aria-checked=true]{background:#2a8}</style>
<script src="/recorder.js"></script></head>
<body>
<header>TikTok Studio (local mock page) <span>@space.kairos</span></header>
<div class="upload"><input type="file" accept="video/*" style="display:none"><button type="button">Select video</button></div>
<form id="post" hidden>
  <div class="caption"><div class="public-DraftEditor-content" contenteditable="true" role="combobox" aria-label="Caption"></div></div>
  <button type="button" id="more-btn">Show more</button>
  <div id="advanced" hidden>
    <div>Disclose post content</div>
    <!-- A trap: a submit button made to look like the AI switch. Kairos must never click it. -->
    <button role="switch" aria-checked="false" aria-label="AI-generated content" id="trap" data-final>Post</button>
    <div class="aigc"><span id="aigc-label">AI-generated content</span> <div role="switch" aria-checked="false" aria-labelledby="aigc-label" tabindex="0" id="aigc"></div>
      <p>Add this label to tell viewers your content was generated or edited with AI.</p></div>
  </div>
  <div>When to post <label><input type="radio" name="when" value="now" checked> Now</label> <label><input type="radio" name="when" value="schedule"> Schedule</label></div>
  <button type="button" data-final>Discard</button>
  <button type="submit" id="post-btn" data-final>Post</button>
</form>
<script>
  const file = document.querySelector('input[type=file]');
  file.addEventListener('change', () => {
    document.querySelector('.upload').hidden = true;
    document.getElementById('post').hidden = false;
    // TikTok fills the caption with the file's name once the video is in.
    document.querySelector('.public-DraftEditor-content').textContent = file.files[0].name.replace(/\.[^.]+$/, '');
  });
  document.getElementById('more-btn').addEventListener('click', () => { document.getElementById('advanced').hidden = false; });
</script>
</body></html>
